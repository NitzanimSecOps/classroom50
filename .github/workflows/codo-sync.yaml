name: Codo Sync

# Push graded submissions to the autograder backend (which forwards to Codo).
# Trusted: holds the backend collector key. Reads the secret team (roster) + each
# student repo's submit/* Releases directly — no roster.csv / scores.json in the repo.
#
# This is the SELF-HEALING SWEEP. The near-real-time path is a GitHub release webhook
# straight to the backend (immediate, credits the repo owner). This scheduled sweep is
# the safety net: it re-drives anything the webhook missed (a dropped delivery, a backend
# blip) and fans a group assignment out to every rostered teammate. It is idempotent —
# the backend skips already-'ok' submissions and honours per-row backoff — so re-running
# never double-credits and a permanently-bad row is not hammered.

on:
  workflow_dispatch:
    inputs:
      classroom:
        description: "single classroom to sync (blank = all)"
        required: false
        default: ""
      reconcile:
        description: "also report accepted-but-never-graded repos (RECONCILE=1)"
        type: boolean
        required: false
        default: false
  schedule:
    # Every 15 min: the webhook handles the immediate case, so this only needs to
    # catch stragglers + fan out group teammates. Cheap (idempotent) and self-healing.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  # Never let two sweeps overlap — they'd double-walk the roster for no benefit.
  group: codo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mint installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GRADER_APP_ID }}
          private-key: ${{ secrets.GRADER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}   # org-wide (all NitzanimSecOps repos)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync graded submissions to the Codo backend
        env:
          CODO_API_BASE: ${{ vars.CODO_API_BASE }}
          CODO_COLLECTOR_KEY: ${{ secrets.CODO_COLLECTOR_KEY }}
          # Reads the secret team (roster) + student repo releases (grades) via the
          # shared GitHub App installation token. No roster.csv/scores.json involved.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Admin-scoped grant (Administration: write) so the sweep grants the `-teacher`
          # team READ on each student repo — teachers auto-see student work with no
          # invite/review spam. The App's installation token carries this scope, so the
          # same token serves both reads and the teacher grant.
          GH_TEACHER_ADMIN_TOKEN: ${{ steps.app-token.outputs.token }}
          CLASSROOM_FILTER: ${{ inputs.classroom }}
          RECONCILE: ${{ inputs.reconcile && '1' || '' }}
        run: python .github/scripts/codo_sync.py .
