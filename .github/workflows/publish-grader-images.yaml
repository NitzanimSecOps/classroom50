name: publish-grader-images

on:
  push:
    branches: [main]
    paths: ['grader-images/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [arp-grader, royal-grader]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: grader-images/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/nitzanimsecops/${{ matrix.image }}:latest
            ghcr.io/nitzanimsecops/${{ matrix.image }}:${{ github.sha }}
